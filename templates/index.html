<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AI Personal Assistant</title>
    <link rel="stylesheet" href="/style.css">
</head>
<body>
    <h1 class="main-heading">AI Personal Assistant</h1>

    <div class="container">

        <h2>Ask Anything</h2>
        <form id="askForm">
            <input type="text" name="question" placeholder="Ask anything..." required>
            <button type="submit">Ask</button>
        </form>
        <p id="ans-loading" style="display: none;">Processing...</p>
        <p id="answer"></p>

        <hr>

        <h2>Summarize Email</h2>
        <form id="emailForm">
            <textarea type="text" name="email" placeholder="Paste your email here.." required></textarea>
            <button type="submit">Summarize</button>
        </form>
        <p id="summary-loading" style="display: none;">Processing...</p>
        <p id="summary"></p>

    </div>

<script>
    async function handleFormSubmit(e, endpoint, loadingId, outputId) {
        e.preventDefault();
        const form = e.target;
        const formData = new FormData(form);
        const loading = document.getElementById(loadingId);
        const output = document.getElementById(outputId);
        const button = form.querySelector("button");

        loading.style.display = "block";
        output.textContent = "";
        button.disabled = true;

        try {
            const res = await fetch(endpoint, {
                method: "POST",
                body: formData
            });

            const data = await res.json();

            if (!res.ok) {
                output.textContent = "Error: " + (data.error || "Something went wrong. Please try again.");
                output.classList.add("error");
            } else {
                output.classList.remove("error");
                output.textContent = data.response;
            }
        } catch (err) {
            output.classList.add("error");
            output.textContent = "Network error: could not reach the server. Please try again.";
        } finally {
            loading.style.display = "none";
            button.disabled = false;
        }
    }

    document.getElementById("askForm").addEventListener("submit", (e) =>
        handleFormSubmit(e, "/ask", "ans-loading", "answer")
    );

    document.getElementById("emailForm").addEventListener("submit", (e) =>
        handleFormSubmit(e, "/summarize", "summary-loading", "summary")
    );
</script>

</body>
</html>
